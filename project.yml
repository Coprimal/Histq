name: "Histq"
options:
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Release builds are arm64 only (like CmdTab/OpenDisplay).
    ARCHS: arm64
    # Ad-hoc default; the app target overrides it with Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "86H6CNLN4C"
packages:
  HistqCore:
    path: Packages/HistqCore
  # The terminal drawer (task 13.1). Pinned by revision: tag v1.19.0 (not the v1.20.0 prerelease or the 1.99.x 2.0 previews).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 464df5207fc2432e16c9a23abe538187196daf5f
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.1, pinned by commit (git ls-remote ... refs/tags/2.10.1; lightweight tag, no ^{}).
    revision: ab7d71291238df6e0492143b120c9b696a35f603
targets:
  "Histq":
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: HistqCore
      - package: SwiftTerm
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.math2it.histq"
        GENERATE_INFOPLIST_FILE: YES
        # Partial plist with the keys Xcode cannot generate (HistqGitHubClientID, Sparkle's SU*), merged with the generated ones.
        INFOPLIST_FILE: App/Info.plist
        # The client ID of the GitHub OAuth App used by "Sign in with GitHub" (device flow; a public value, no secret).
        # Empty until one is registered: Settings › Integrations then shows how to set it, and paste/import still work.
        HISTQ_GITHUB_CLIENT_ID: "Ov23lilXKw7T9nxuYtxC"
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_CFBundleDisplayName: "Histq"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Debug is Developer ID-signed like Release, so Keychain items and macOS grants survive rebuilds and are shared with the installed app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
