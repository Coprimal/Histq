name: Deploy website

# Publishes the landing site (website/) and the Sparkle feed (root appcast.xml) to GitHub Pages
# at https://histq.coprimal.dev, so the app's SUFeedURL is https://histq.coprimal.dev/appcast.xml.
# A deploy replaces the whole site, so both are staged together on every run.
# Requires Settings > Pages > Source = "GitHub Actions".
# scripts/publish-appcast.sh pushes the new appcast.xml to main, which triggers this workflow.
# Note: thi-create-website's render.py rewrites this file; re-apply the appcast lines after a re-render.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'appcast.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R website/. _site/
          # appcast.xml exists from the first release on; before it the site deploys alone.
          if [ -f appcast.xml ]; then cp appcast.xml _site/appcast.xml; fi
          for f in _site/index.html; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
